name: Build Setup

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
      NEXT_TELEMETRY_DISABLED: 1
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate database SQL
        run: npx drizzle-kit generate

      - name: Upload database SQL
        uses: actions/upload-artifact@v4
        with:
          name: db-sql
          path: drizzle/**/*.sql

      - name: Create .env for build
        shell: cmd
        run: |
          echo DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app_db> .env
          echo NEXT_TELEMETRY_DISABLED=1>> .env

      - name: Build Next.js app
        run: npm run build

      - name: Show desktop package.json (debug)
        shell: cmd
        run: type desktop\package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Setup.exe with electron-builder
        working-directory: desktop
        shell: cmd
        run: npx --yes electron-builder --win nsis --x64 --publish never

      - name: List output files (debug)
        shell: cmd
        run: |
          dir desktop\dist-setup
          exit /b 0

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: Chapino-Setup
          path: desktop/dist-setup/*.exe
          retention-days: 30
